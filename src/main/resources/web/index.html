<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>Server-Wirtschaft Dashboard</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
  <nav class="top-nav">
    <a href="/" class="active">Übersicht</a>
    <a href="/economy.html">Wirtschaft</a>
    <a href="/traders.html">Händler</a>
    <a href="/towny.html">Towny</a>
    <a href="/quickshops.html">QuickShops</a>
    <a href="/regionmarket.html">AdvancedRegionMarket</a>
    <span class="spacer"></span>
    <a href="/logout" class="logout">Abmelden</a>
  </nav>

  <h1>Server-Wirtschaft Dashboard</h1>
  <div class="sub" id="updated">lade...</div>

  <input type="text" class="search-box" id="searchInput" placeholder="Suche nach Spieler, Shop oder Item...">
  <div id="searchResults" class="panel" style="display:none; margin-bottom:24px;"></div>

  <div class="landing-links">
    <a class="panel" href="/economy.html">
      <div class="stat-value" id="lnkMoney">-</div>
      <div class="stat-label">Geld im Umlauf &middot; Wirtschaft &rarr;</div>
    </a>
    <a class="panel" href="/traders.html">
      <div class="stat-value" id="lnkTraders">-</div>
      <div class="stat-label">Händler-Transaktionen &middot; dtlTradersPlus &rarr;</div>
    </a>
    <a class="panel" href="/towny.html">
      <div class="stat-value" id="lnkTowny">-</div>
      <div class="stat-label">Städte &middot; Towny &rarr;</div>
    </a>
    <a class="panel" href="/quickshops.html">
      <div class="stat-value" id="lnkQuickShops">-</div>
      <div class="stat-label">Bekannte Shops &middot; QuickShops &rarr;</div>
    </a>
    <a class="panel" href="/regionmarket.html">
      <div class="stat-value" id="lnkRegionMarket">-</div>
      <div class="stat-label">Regionen &middot; AdvancedRegionMarket &rarr;</div>
    </a>
  </div>

<script src="/app.js"></script>
<script>
async function refreshOverview() {
  try {
    const [economy, traders, towny, quickshops, regionmarket] = await Promise.all([
      fetch('/api/economy/overview').then(r => r.json()),
      fetch('/api/traders/overview').then(r => r.json()),
      fetch('/api/towny/overview').then(r => r.json()),
      fetch('/api/quickshops/overview').then(r => r.json()),
      fetch('/api/regionmarket/overview').then(r => r.json())
    ]);

    document.getElementById('updated').textContent =
      'Stand: ' + new Date(economy.generatedAtMillis).toLocaleString('de-DE');
    document.getElementById('lnkMoney').textContent = formatMoney(economy.totalMoney);
    document.getElementById('lnkTraders').textContent = formatNumber(traders.totalTransactions);
    document.getElementById('lnkTowny').textContent = formatNumber(towny.totalTowns);
    document.getElementById('lnkQuickShops').textContent = formatNumber(quickshops.totalShops);
    document.getElementById('lnkRegionMarket').textContent = formatNumber(regionmarket.totalRegions);
  } catch (e) {
    document.getElementById('updated').textContent = 'Fehler beim Laden: ' + e;
  }
}

refreshOverview();
setInterval(refreshOverview, 30000);
</script>
</body>
</html>
