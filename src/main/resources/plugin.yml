name: EconomyDashboard
version: ${project.version}
main: com.thedomibusiness.economydashboard.EconomyDashboardPlugin
api-version: 1.13
depend: [Vault]
softdepend: [Towny, dtlTradersPlus, QuickShop-Hikari, AdvancedRegionMarket]
libraries:
  - org.xerial:sqlite-jdbc:3.51.1.0
authors: [thedomibusiness, THE_D0MI]
description: Web dashboard for server-wide economy, trader and town overview.
commands:
  ecodash:
    description: EconomyDashboard admin command
    usage: /ecodash <status|reload>
permissions:
  economydashboard.admin:
    description: Allows /ecodash status and /ecodash reload
    default: op
